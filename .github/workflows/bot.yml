name: bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *" # cadangan: hidupkan lagi kalau rantai restart sempat putus

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write # menyimpan data.enc
  actions: write # menyalakan run berikutnya

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }} # ambil commit terbaru, bukan commit saat run dijadwalkan
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python -u bot.py # -u: log langsung tertulis, tidak hilang saat run dihentikan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
      - name: Nyalakan ulang bot
        run: gh workflow run bot.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
